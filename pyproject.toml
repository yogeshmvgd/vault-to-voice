[project]
name = "vault-to-voice"
version = "0.1.0"
description = "LangGraph agent that turns Obsidian notes into blog posts in your own voice"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-frontmatter>=1.1",
  "numpy>=1.26",
  "faiss-cpu>=1.8",
  "scikit-learn>=1.4",
  "sentence-transformers>=3.0",
  "openai>=1.40",
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "typer>=0.12",
  "structlog>=24.1",
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=3.1",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.2"]
ollama = ["langchain-ollama>=0.2"]

[project.scripts]
v2v = "vault_to_voice.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_to_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs real models or network"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
exclude = ["docs/**"]
